<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23c9f45b'><circle cx='12' cy='12' r='10'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LightSafe — Street-light Repair Decision Support</title>
    <meta name="description" content="Street-light repair decision support: which outages to repair first, and why." />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("lightsafe-theme");
          if (t !== "light" && t !== "dark") t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  </head>
  <body class="bg-paper text-ink antialiased selection:bg-signal selection:text-night-deep">
    <noscript>LightSafe requires JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
